name: regression

on: [push, pull_request]

jobs:
  regress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator make python3

      - name: Show Verilator version
        run: verilator --version

      - name: Lint
        run: make lint

      - name: Run regression
        run: make regress
